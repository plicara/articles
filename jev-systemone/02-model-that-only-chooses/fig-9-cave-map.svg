<line x1="490" y1="630" x2="300" y2="630" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="300" y1="90" x2="110" y2="90" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<polyline fill="none" class="l0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="291,81 101,81"/>
<polyline fill="none" class="l2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="110,90 110,175 110,260 110,345 110,460 300,460 490,460"/>
<polyline fill="none" class="l1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="308,98 118,98 118,183 118,268 118,353 118,468 308,468 498,468 688,468 688,553 688,638 498,638 308,638"/>
<rect x="48" y="73" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="94" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">End of road</text>
<rect x="238" y="73" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="300" y="94" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Well house</text>
<rect x="48" y="158" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="179" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Valley</text>
<rect x="48" y="243" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="264" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Slit in streambed</text>
<rect x="48" y="328" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="349" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Outside grate</text>
<rect x="48" y="443" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="464" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Below the grate</text>
<rect x="238" y="443" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="300" y="464" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Cobble crawl</text>
<rect x="428" y="443" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="490" y="464" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Debris room</text>
<rect x="618" y="443" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="680" y="464" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Sloping canyon</text>
<rect x="618" y="528" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="680" y="549" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Bird chamber</text>
<rect x="618" y="613" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="680" y="634" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Top of small pit</text>
<rect x="428" y="613" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="490" y="634" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Hall of Mists</text>
<rect x="238" y="613" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="300" y="634" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink)">Fissure, east bank</text>
<circle cx="372" cy="82" r="6" class="s1 ring"/><text class="s" x="384" y="78">lamp lit here, turn 4</text><text class="s" x="384" y="94">(Jev picked the proposer's 5th idea)</text>
<text x="490" y="508" text-anchor="middle" style="font:600 14px var(--fb);fill:var(--s2)">✕ fell into a pit, turn 91</text>
<text x="490" y="524" text-anchor="middle" style="font:13px var(--fb);fill:var(--darkink)">lamp in hand, never lit</text>
<text x="300" y="672" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink2)">44 turns here</text>
<text x="300" y="688" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink2)">alive at turn 200</text>
<text x="205" y="58" text-anchor="middle" style="font:13px var(--fb);fill:var(--ink2)">171 looks, 300 turns</text>
<line x1="20" y1="716" x2="48" y2="716" class="l0" stroke-width="4" stroke-linecap="butt"/><text class="s" x="56" y="720">round 1, naive options</text>
<line x1="220" y1="716" x2="244" y2="716" class="l2" stroke-width="4" stroke-linecap="round"/><text class="s" x="252" y="720">round 5, Jev alone</text>
<line x1="400" y1="716" x2="424" y2="716" class="l1" stroke-width="4" stroke-linecap="round"/><text class="s" x="432" y="720">round 5, Jev plus a proposer's ideas</text>
<text class="cap" x="16" y="748">Schematic, not to scale: only the rooms these runs reached. Routes recomputed from the committed transcripts.</text>
