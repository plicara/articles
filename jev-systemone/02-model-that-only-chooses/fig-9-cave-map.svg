<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" role="img" aria-label="Schematic map of the rooms reached in Colossal Cave. The round 1 naive run shuttles between the road and the well house. In round 5, Jev alone goes down the grate and dies in the dark debris room. Jev choosing from a proposer's ideas lights the lamp on turn 4 and reaches the fissure, alive at turn 200.">
<title>colossal cave: how far each run got</title>
<desc>Schematic map of the rooms reached in Colossal Cave. The round 1 naive run shuttles between the road and the well house. In round 5, Jev alone goes down the grate and dies in the dark debris room. Jev choosing from a proposer's ideas lights the lamp on turn 4 and reaches the fissure, alive at turn 200.</desc>
<style>
svg{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--mut:#8a8983;--grid:#e4e3de;--line:#cfcdc6;--box:#f3f2ee;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--dark:#2b2a27;--darkink:#ecebe6}
@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--mut:#8f8e87;--grid:#2e2d2a;--line:#45443f;--box:#23231f;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--dark:#0e0e0d;--darkink:#ecebe6}}
.bg{fill:var(--bg)}.box{fill:var(--box);stroke:var(--line);stroke-width:1}
.t{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.tb{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.h{font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.s{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink2)}
.cap{font:11.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--mut)}
.m{font:12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:var(--ink)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--line);stroke-width:1}
.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2)}.l3{stroke:var(--s3)}
.mutf{fill:var(--mut)}.mutl{stroke:var(--mut)}.linef{fill:var(--line)}
.ring{stroke:var(--bg);stroke-width:2}
</style>
<rect class="bg" width="820" height="760"/>
<text class="h" x="16" y="30">colossal cave: how far each run got</text>
<rect x="16" y="400" width="788" height="290" rx="6" fill="var(--grid)" opacity="0.55"/>
<rect x="400" y="410" width="394" height="270" rx="6" fill="var(--dark)" opacity="0.9"/>
<text class="cap" x="280" y="424">UNDERGROUND</text><text x="784" y="428" text-anchor="end" style="font:11.5px system-ui,sans-serif;fill:var(--darkink)">pitch dark without a lit lamp</text>
<text class="cap" x="30" y="66">SURFACE</text>
<line x1="110" y1="90" x2="300" y2="90" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="110" y1="90" x2="110" y2="175" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="110" y1="175" x2="110" y2="260" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="110" y1="260" x2="110" y2="345" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="110" y1="345" x2="110" y2="460" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="110" y1="460" x2="300" y2="460" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="300" y1="460" x2="490" y2="460" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="490" y1="460" x2="680" y2="460" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="680" y1="460" x2="680" y2="545" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="680" y1="545" x2="680" y2="630" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="680" y1="630" x2="490" y2="630" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="490" y1="630" x2="300" y2="630" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<line x1="300" y1="90" x2="110" y2="90" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
<polyline fill="none" class="mutl" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="291,81 101,81"/>
<polyline fill="none" class="l2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="110,90 110,175 110,260 110,345 110,460 300,460 490,460"/>
<polyline fill="none" class="l1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="308,98 118,98 118,183 118,268 118,353 118,468 308,468 498,468 688,468 688,553 688,638 498,638 308,638"/>
<rect x="48" y="73" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="94" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">End of road</text>
<rect x="238" y="73" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="300" y="94" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Well house</text>
<rect x="48" y="158" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="179" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Valley</text>
<rect x="48" y="243" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="264" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Slit in streambed</text>
<rect x="48" y="328" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="349" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Outside grate</text>
<rect x="48" y="443" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="110" y="464" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Below the grate</text>
<rect x="238" y="443" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="300" y="464" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Cobble crawl</text>
<rect x="428" y="443" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="490" y="464" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Debris room</text>
<rect x="618" y="443" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="680" y="464" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Sloping canyon</text>
<rect x="618" y="528" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="680" y="549" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Bird chamber</text>
<rect x="618" y="613" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="680" y="634" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Top of small pit</text>
<rect x="428" y="613" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="490" y="634" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Hall of Mists</text>
<rect x="238" y="613" width="124" height="34" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="300" y="634" text-anchor="middle" style="font:12px system-ui,sans-serif;fill:var(--ink)">Fissure, east bank</text>
<circle cx="372" cy="82" r="6" class="s1 ring"/><text class="s" x="384" y="78">lamp lit here, turn 4</text><text class="s" x="384" y="94">(Jev picked the proposer's 5th idea)</text>
<text x="490" y="508" text-anchor="middle" style="font:600 13px system-ui,sans-serif;fill:var(--s2)">✕ fell into a pit, turn 91</text>
<text x="490" y="524" text-anchor="middle" style="font:11.5px system-ui,sans-serif;fill:var(--darkink)">lamp in hand, never lit</text>
<text x="300" y="672" text-anchor="middle" style="font:11.5px system-ui,sans-serif;fill:var(--ink2)">44 turns here</text>
<text x="300" y="688" text-anchor="middle" style="font:11.5px system-ui,sans-serif;fill:var(--ink2)">alive at turn 200</text>
<text x="205" y="58" text-anchor="middle" style="font:11.5px system-ui,sans-serif;fill:var(--ink2)">171 looks, 300 turns</text>
<line x1="20" y1="716" x2="44" y2="716" class="mutl" stroke-width="4" stroke-linecap="round"/><text class="s" x="52" y="720">round 1, naive options</text>
<line x1="220" y1="716" x2="244" y2="716" class="l2" stroke-width="4" stroke-linecap="round"/><text class="s" x="252" y="720">round 5, Jev alone</text>
<line x1="400" y1="716" x2="424" y2="716" class="l1" stroke-width="4" stroke-linecap="round"/><text class="s" x="432" y="720">round 5, Jev choosing from its own list plus a proposer's ideas</text>
<text class="cap" x="16" y="748">Schematic, not to scale: only the rooms these runs reached. Routes recomputed from the committed transcripts.</text>
</svg>
