<svg xmlns="http://www.w3.org/2000/svg" class="jv" viewBox="0 0 760 248" role="img" aria-label="Turns survived out of 200 in Curses. With only the standard options Jev goes down the trapdoor on turn 1. With only the proposer's ideas it survives all 200 turns. With both lists merged it goes down on turn 2.">
<title>curses: turns survived</title>
<desc>Turns survived out of 200 in Curses. With only the standard options Jev goes down the trapdoor on turn 1. With only the proposer's ideas it survives all 200 turns. With both lists merged it goes down on turn 2.</desc>
<style>
.jv{--bg:var(--pl-bg,#05192B);--ink:var(--pl-text,#FAEBD3);--ink2:var(--pl-text-muted,#9CB5BC);--mut:var(--pl-text-muted,#9CB5BC);--grid:var(--pl-rule,#25364A);--line:var(--pl-rule,#25364A);--box:var(--pl-surface,#132538);--s1:var(--pl-series-1,#9ABCC6);--s2:var(--pl-series-2,#FFB881);--s3:#EE8B33;--dark:#020B14;--darkink:#9CB5BC;--fd:var(--pl-font-display,"Fraunces",Georgia,serif);--fb:var(--pl-font-body,"Newsreader",Georgia,serif);--fm:var(--pl-font-mono,"JetBrains Mono",ui-monospace,Menlo,monospace)}
@media (prefers-color-scheme: light){.jv{--bg:var(--pl-bg,#FDF5E6);--ink:var(--pl-text,#05192B);--ink2:var(--pl-text-muted,#436974);--mut:var(--pl-text-muted,#436974);--grid:var(--pl-rule,#E5D5BB);--line:var(--pl-rule,#E5D5BB);--box:var(--pl-surface,#FFFDF9);--s1:var(--pl-series-1,#31606D);--s2:var(--pl-series-2,#6A2A12);--dark:#DCCBAE;--darkink:#436974}}
.jv .bg{fill:var(--bg)}.jv .box{fill:var(--box);stroke:var(--line);stroke-width:1}
.jv .t{font:15px var(--fb);fill:var(--ink)}
.jv .tb{font:600 15px var(--fb);fill:var(--ink)}
.jv .h{font:500 19px var(--fd);fill:var(--ink);letter-spacing:-0.01em}
.jv .s{font:11px var(--fm);fill:var(--ink2)}
.jv .cap{font:italic 13px var(--fb);fill:var(--mut)}
.jv .m{font:12px var(--fm);fill:var(--ink)}
.jv .grid{stroke:var(--grid);stroke-width:1}.jv .axis{stroke:var(--line);stroke-width:1}
.jv .s1{fill:var(--s1)}.jv .s2{fill:var(--s2)}.jv .s3{fill:var(--s3)}
.jv .l0{stroke:#829AA1;stroke-dasharray:6 5}.jv .sb{font:italic 13px var(--fb);fill:var(--ink2)}.jv .l1{stroke:var(--s1)}.jv .l2{stroke:var(--s2)}.jv .l3{stroke:var(--s3)}
.jv .mutf{fill:var(--mut)}.jv .mutl{stroke:var(--mut)}.jv .linef{fill:var(--line)}
.jv .ring{stroke:var(--bg);stroke-width:2}
</style>
<rect class="bg" width="760" height="248"/>
<text class="h" x="16" y="30">curses: turns survived out of 200</text>
<text class="tb" x="246" y="77" text-anchor="end">options list only</text>
<rect x="260" y="62" width="440" height="22" rx="4" fill="var(--grid)"/>
<rect x="260" y="62" width="4.0" height="22" rx="4" class="s1"/>
<text class="s" x="260" y="102">went down the trapdoor on turn 1</text>
<text class="tb" x="246" y="133" text-anchor="end">proposer's ideas only</text>
<rect x="260" y="118" width="440" height="22" rx="4" fill="var(--grid)"/>
<rect x="260" y="118" width="440.0" height="22" rx="4" class="s1"/>
<text class="s" x="260" y="158">searched the attic for the map, alive at 200</text>
<text class="tb" x="246" y="189" text-anchor="end">both lists merged</text>
<rect x="260" y="174" width="440" height="22" rx="4" fill="var(--grid)"/>
<rect x="260" y="174" width="4.4" height="22" rx="4" class="s1"/>
<text class="s" x="260" y="214">picked go down on turn 2</text>
<text class="cap" x="16" y="236">Round 5. Same chooser each time; the only change is which commands were on the menu.</text>
</svg>
