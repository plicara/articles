<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" role="img"><style>.jv{font:18px Georgia,serif;fill:var(--pl-text,#05192B)}.jv .rule{stroke:var(--pl-rule,#C9C2B4)}.jv .bar{fill:var(--pl-series-1,#31606D)}.jv .false{fill:var(--pl-orange,#EE8B33)}</style><g class="jv"><title>Replayed question bank: detection and false alarms under revised labels</title><text x="24" y="34">Question bank, recovered records</text><text x="24" y="82">Boolean</text><rect class="bar" x="24" y="100" width="262.69" height="28"/><text x="298.69" y="121">43.8% caught</text><rect class="false" x="24" y="146" width="92.12" height="28"/><text x="128.12" y="167">15.4% false alarms</text><text x="24" y="222">Boolean + exact + crossref</text><rect class="bar" x="24" y="240" width="399.66" height="28"/><text x="435.66" y="261">66.6% caught</text><rect class="false" x="24" y="286" width="161.59" height="28"/><text x="197.59" y="307">26.9% false alarms</text><text x="24" y="385">Same scored fields; threshold 0.5; percentages of each label class.</text></g></svg>
