<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Share of bad extracted values caught, by kind of mistake, for the original reworded question against a set of questions aimed at each kind. Every kind improves; cut-short values and wrong values improve most; garbled OCR stays low.">
<title>how many bad values got caught</title>
<desc>Share of bad extracted values caught, by kind of mistake, for the original reworded question against a set of questions aimed at each kind. Every kind improves; cut-short values and wrong values improve most; garbled OCR stays low.</desc>
<style>
svg{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--mut:#8a8983;--grid:#e4e3de;--line:#cfcdc6;--box:#f3f2ee;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--dark:#2b2a27;--darkink:#ecebe6}
@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--mut:#8f8e87;--grid:#2e2d2a;--line:#45443f;--box:#23231f;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--dark:#0e0e0d;--darkink:#ecebe6}}
.bg{fill:var(--bg)}.box{fill:var(--box);stroke:var(--line);stroke-width:1}
.t{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.tb{font:600 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.h{font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.s{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink2)}
.cap{font:11.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--mut)}
.m{font:12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:var(--ink)}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--line);stroke-width:1}
.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}
.l1{stroke:var(--s1)}.l2{stroke:var(--s2)}.l3{stroke:var(--s3)}
.mutf{fill:var(--mut)}.mutl{stroke:var(--mut)}.linef{fill:var(--line)}
.ring{stroke:var(--bg);stroke-width:2}
</style>
<rect class="bg" width="760" height="340"/>
<text class="h" x="16" y="30">how many bad values got caught, by kind of mistake</text>
<line class="grid" x1="300.0" y1="56" x2="300.0" y2="262"/><text class="s" x="300.0" y="280" text-anchor="middle">0%</text>
<line class="grid" x1="407.5" y1="56" x2="407.5" y2="262"/><text class="s" x="407.5" y="280" text-anchor="middle">25%</text>
<line class="grid" x1="515.0" y1="56" x2="515.0" y2="262"/><text class="s" x="515.0" y="280" text-anchor="middle">50%</text>
<line class="grid" x1="622.5" y1="56" x2="622.5" y2="262"/><text class="s" x="622.5" y="280" text-anchor="middle">75%</text>
<line class="grid" x1="730.0" y1="56" x2="730.0" y2="262"/><text class="s" x="730.0" y="280" text-anchor="middle">100%</text>
<text class="t" x="286" y="84" text-anchor="end">mixed up with a neighbouring field</text>
<line x1="622.5" y1="80" x2="687.0" y2="80" class="l1" stroke-width="2"/>
<circle cx="622.5" cy="80" r="5.5" fill="var(--bg)" stroke="var(--mut)" stroke-width="2"/>
<circle cx="687.0" cy="80" r="6" class="s1 ring"/>
<text class="t" x="286" y="126" text-anchor="end">a different value entirely</text>
<line x1="484.9" y1="122" x2="656.9" y2="122" class="l1" stroke-width="2"/>
<circle cx="484.9" cy="122" r="5.5" fill="var(--bg)" stroke="var(--mut)" stroke-width="2"/>
<circle cx="656.9" cy="122" r="6" class="s1 ring"/>
<text class="t" x="286" y="168" text-anchor="end">a number slightly off</text>
<line x1="463.4" y1="164" x2="519.3" y2="164" class="l1" stroke-width="2"/>
<circle cx="463.4" cy="164" r="5.5" fill="var(--bg)" stroke="var(--mut)" stroke-width="2"/>
<circle cx="519.3" cy="164" r="6" class="s1 ring"/>
<text class="t" x="286" y="210" text-anchor="end">cut short</text>
<line x1="355.9" y1="206" x2="467.7" y2="206" class="l1" stroke-width="2"/>
<circle cx="355.9" cy="206" r="5.5" fill="var(--bg)" stroke="var(--mut)" stroke-width="2"/>
<circle cx="467.7" cy="206" r="6" class="s1 ring"/>
<text class="t" x="286" y="252" text-anchor="end">garbled by the OCR</text>
<line x1="377.4" y1="248" x2="416.1" y2="248" class="l1" stroke-width="2"/>
<circle cx="377.4" cy="248" r="5.5" fill="var(--bg)" stroke="var(--mut)" stroke-width="2"/>
<circle cx="416.1" cy="248" r="6" class="s1 ring"/>
<circle cx="24" cy="306" r="5.5" fill="var(--bg)" stroke="var(--mut)" stroke-width="2"/><text class="s" x="36" y="310">one question, reworded</text>
<circle cx="200" cy="306" r="6" class="s1"/><text class="s" x="212" y="310">one question aimed at each kind of mistake</text>
<text class="cap" x="16" y="326">In-text fields from 18 extraction systems on ExtractBench. The new questions also flag more good values by mistake.</text>
</svg>
