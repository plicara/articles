<svg xmlns="http://www.w3.org/2000/svg" class="jv" viewBox="0 0 760 570" role="img" aria-label="Four-panel meme in the That Damn Smile format. Panel one: the game warns it is pitch dark and you may fall into a pit, captioned so you see, that's where the trouble began. Panel two: the unlit brass lantern. Panel three: the inventory shows the lantern, captioned that lamp. Panel four: you fell into a pit, captioned that damn lamp.">
<title>that damn lamp</title>
<desc>Four-panel meme in the That Damn Smile format. Panel one: the game warns it is pitch dark and you may fall into a pit, captioned so you see, that's where the trouble began. Panel two: the unlit brass lantern. Panel three: the inventory shows the lantern, captioned that lamp. Panel four: you fell into a pit, captioned that damn lamp.</desc>
